# ==============================================================================
# MECÂNIQA TECH - ORQUESTRAÇÃO DA STACK DE MONITORAMENTO (DOCKER COMPOSE)
# Módulo: OAT 2 - Monitoramento, Observabilidade e Continuidade
# Arquivo: docker-compose.yml
# ==============================================================================

services:
  # Microserviço: Simulador de Telemetria de Sensores IoT
  simulador-sensores:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: mecaniqa-simulador-sensores:local
    container_name: mecaniqa-simulador-sensores
    ports:
      - "8000:8000"
    environment:
      - SENSOR_ERROR_RATE=0.05
      - SENSOR_INTERVAL_SECONDS=2
    networks:
      - mecaniqa-net
    restart: unless-stopped

  # Servidor de Métricas e Alertas: Prometheus TSDB
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mecaniqa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - simulador-sensores
    networks:
      - mecaniqa-net
    restart: unless-stopped

  # Servidor de Dashboards e Visualização: Grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: mecaniqa-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mecaniqa-net
    restart: unless-stopped

networks:
  mecaniqa-net:
    driver: bridge
