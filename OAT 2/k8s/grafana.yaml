apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-provisioning
          projected:
            sources:
              - configMap:
                  name: grafana-provisioning
                  items:
                    - key: dashboards.yaml
                      path: dashboards/default.yaml
              - configMap:
                  name: grafana-datasources
                  items:
                    - key: prometheus.yaml
                      path: datasources/prometheus.yaml
              - configMap:
                  name: grafana-dashboard-definitions
                  items:
                    - key: mecaniqa-sensor-dashboard.json
                      path: dashboards/mecaniqa-sensor-dashboard.json
