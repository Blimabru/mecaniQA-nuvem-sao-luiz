# ==============================================================================
# MECÂNIQA TECH - INFRAESTRUTURA DE VISUALIZAÇÃO E DASHBOARDS (GRAFANA)
# Módulo: OAT 2 - Monitoramento, Observabilidade e Continuidade
# Arquivo: grafana.yaml
# Descrição: Implantação e exposição do Grafana Server no Kubernetes com
#            auto-provisionamento declarativo de Data Sources e Dashboards.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SERVIÇO DE REDE DO GRAFANA (SERVICE)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
    component: visualization
spec:
  type: ClusterIP  # Acesso interno na malha do cluster; exposto localmente via port-forward
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# ------------------------------------------------------------------------------
# 2. IMPLANTAÇÃO DO SERVIDOR GRAFANA (DEPLOYMENT)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
    component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - name: http
              containerPort: 3000
          # Variáveis de ambiente para parametrização do Grafana
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_DEFAULT_THEME
              value: "light"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            # Define o caminho padrão onde os arquivos de auto-provisionamento são lidos
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          # Probes de verificação de integridade
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            # Armazenamento volátil da base interna do Grafana
            - name: grafana-storage
              mountPath: /var/lib/grafana
            # Ponto de montagem para o provisionamento automático de datasources e dashboards
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
      volumes:
        - name: grafana-storage
          emptyDir: {}
        # Volume projetado combinando três ConfigMaps distintos em uma árvore de diretórios unificada:
        # - datasources/prometheus.yaml (Conexão com Prometheus)
        # - dashboards/default.yaml     (Provedor de Dashboards em arquivo)
        # - dashboards/*.json           (Definições JSON dos painéis visuais)
        - name: grafana-provisioning
          projected:
            sources:
              - configMap:
                  name: grafana-provisioning
                  items:
                    - key: dashboards.yaml
                      path: dashboards/default.yaml
              - configMap:
                  name: grafana-datasources
                  items:
                    - key: prometheus.yaml
                      path: datasources/prometheus.yaml
              - configMap:
                  name: grafana-dashboard-definitions
                  items:
                    - key: mecaniqa-sensor-dashboard.json
                      path: dashboards/mecaniqa-sensor-dashboard.json
