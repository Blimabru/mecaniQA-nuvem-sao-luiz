# ==============================================================================
# MECÂNIQA TECH - PROVISIONAMENTO DECLARATIVO DE DASHBOARDS E DATASOURCES
# Módulo: OAT 2 - Monitoramento, Observabilidade e Continuidade
# Arquivo: grafana-dashboards.yaml
# Descrição: Define os ConfigMaps para provisionamento automático do Grafana:
#            1. Provedor de dashboards em arquivo (grafana-provisioning)
#            2. Conexão automática com o Prometheus como Data Source (grafana-datasources)
#            3. Definição do Dashboard formal da MecâniQA Tech contendo:
#               - Os 4 Dashboards Obrigatórios de Golden Signals (CPU, Memória, Erro e Sucesso)
#               - Os 4 Painéis de Telemetria Específica dos Sensores IoT
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURAÇÃO DO PROVEDOR DE DASHBOARDS (DASHBOARD PROVIDER)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: default
  labels:
    app: grafana
    component: visualization
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "MecaniQA Dashboards"
        orgId: 1
        folder: "MecaniQA"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
# ------------------------------------------------------------------------------
# 2. PROVISIONAMENTO DO DATA SOURCE PROMETHEUS
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
  labels:
    app: grafana
    component: visualization
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 5s
---
# ------------------------------------------------------------------------------
# 3. ESPECIFICAÇÃO COMPLETA DO DASHBOARD MECÂNIQA TECH (JSON)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-definitions
  namespace: default
  labels:
    app: grafana
    component: visualization
data:
  mecaniqa-sensor-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Os 4 Painéis Obrigatórios (Golden Signals & Governança de SLA)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Utilização (%)",
                "axisPlacement": "auto",
                "fillOpacity": 20,
                "lineWidth": 2
              },
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 70 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 10,
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"kubernetes-services\"}[1m]) * 100 or rate(process_cpu_seconds_total[1m]) * 100",
              "legendFormat": "CPU do processo Python (%)",
              "refId": "A"
            }
          ],
          "title": "1. Consumo de CPU do Simulador (Infraestrutura)",
          "description": "Monitora o uso de processamento do processo do simulador. Alarme configurado para > 80% e gatilho de HPA em 70%.",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Memória",
                "axisPlacement": "auto",
                "fillOpacity": 20,
                "lineWidth": 2
              },
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 107374182 },
                  { "color": "red", "value": 118111600 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 20,
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"kubernetes-services\"} or process_resident_memory_bytes",
              "legendFormat": "Memória residente do processo Python",
              "refId": "A"
            }
          ],
          "title": "2. Consumo de Memória do Simulador (Infraestrutura)",
          "description": "Monitora a memória residente (RSS) utilizada pelo processo em relação ao limite do contêiner (128Mi). Alarme em 80%.",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Taxa de Erro (%)",
                "axisPlacement": "auto",
                "fillOpacity": 25,
                "lineWidth": 2
              },
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 10 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "id": 30,
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "(sum(rate(sensor_readings_total{status=\"error\"}[1m])) / sum(rate(sensor_readings_total[1m]))) * 100",
              "legendFormat": "Taxa de Falhas de Telemetria (%)",
              "refId": "A"
            }
          ],
          "title": "3. Taxa de Erro na Aplicação (Golden Signal - Erros)",
          "description": "Proporção de leituras com status de erro em relação ao total emitido. Limiar crítico de alarme em 10%.",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Taxa de Sucesso (%)",
                "axisPlacement": "auto",
                "fillOpacity": 25,
                "lineWidth": 2
              },
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 85 },
                  { "color": "green", "value": 90 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "id": 40,
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "min", "lastNotNull"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "(sum(rate(sensor_readings_total{status=\"ok\"}[1m])) / sum(rate(sensor_readings_total[1m]))) * 100",
              "legendFormat": "Taxa de Sucesso Operacional (%)",
              "refId": "A"
            }
          ],
          "title": "4. Taxa de Sucesso na Aplicação (SLI de Disponibilidade)",
          "description": "Percentual de telemetria processada com êxito. Meta contratual de SLO de no mínimo 90% para clientes Enterprise.",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 200,
          "title": "Telemetria Específica dos Sensores IoT Automotivos",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "celsius"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 18 },
          "id": 1,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "sensor_temperature_celsius{sensor=\"motor-01\"}",
              "legendFormat": "Temperatura",
              "refId": "A"
            }
          ],
          "title": "Temperatura do Sensor",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "mm/s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 18 },
          "id": 2,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "sensor_vibration_mm_s{sensor=\"motor-01\"}",
              "legendFormat": "Vibração",
              "refId": "A"
            }
          ],
          "title": "Vibração do Motor",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "kPa"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 18 },
          "id": 3,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "expr": "sensor_pressure_kpa{sensor=\"motor-01\"}",
              "legendFormat": "Pressão",
              "refId": "A"
            }
          ],
          "title": "Pressão do Sistema",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 18 },
          "id": 4,
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "sensor_health{sensor=\"motor-01\"}",
              "legendFormat": "Saúde Operacional",
              "refId": "A"
            }
          ],
          "title": "Estado de Saúde do Sensor",
          "type": "gauge"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "style": "light",
      "tags": ["mecaniqa", "sensors", "golden-signals", "oat2"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "MecâniQA - Monitoramento e Observabilidade (OAT 2)",
      "uid": "mecaniqa-sensors",
      "version": 2,
      "weekStart": ""
    }
