# Configuração mínima do Redis para ambiente local de laboratório.
#
# O bind em 0.0.0.0 permite que o serviço receba conexões de outros contêineres
# na rede interna do Docker. A desativação do protected-mode é adequada para
# cenários de testes locais e demonstração de infraestrutura, em que o acesso é
# controlado pela rede virtual do ambiente.
bind 0.0.0.0
protected-mode no
port 6379

# Política de persistência mínima para ambiente de laboratório.
# O Redis é executado como cache em memória, e a persistência de disco é mantida
# em configuração simplificada para validar a infraestrutura sem aumentar a
# complexidade da prova de conceito.
save 60 1
appendonly no
