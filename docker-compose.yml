version: '3.8'

services:
  # Serviço da API Java
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # A aplicação encontra o banco e o redis pelo nome dos serviços (db e redis)
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/mecaniqa
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - mecaniqa-network

  # Serviço do MySQL
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=mecaniqa
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      # Persistência de dados: mapeia o volume 'mysql_data' para o diretório interno do MySQL
      - mysql_data:/var/lib/mysql
    networks:
      - mecaniqa-network

  # Serviço do Redis
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mecaniqa-network

# Declaração dos volumes
volumes:
  mysql_data:

# Declaração da rede interna (isolamento na Camada Virtual)
networks:
  mecaniqa-network:
