# Arquivo principal de orquestração do ecossistema da MecaniQA.
# O Docker Compose sobe a API Java, o MySQL e o Redis em uma rede interna
# para que a aplicação possa se comunicar por nome de serviço.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mecaniqa-api:local
    container_name: mecaniqa-api
    restart: unless-stopped
    ports:
      - "8080:8080" # expõe a API na porta 8080 do host
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mecaniqa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy # aguarda o banco ficar disponível
      redis:
        condition: service_started
    networks:
      - mecaniqa-network

  db:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    image: mecaniqa-mysql:8.0
    container_name: mecaniqa-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mecaniqa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306" # porta do MySQL exposta para acesso local
    volumes:
      - mysql_data:/var/lib/mysql # persistência dos dados do banco
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mecaniqa-network

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: mecaniqa-redis:alpine
    container_name: mecaniqa-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379" # porta do Redis exposta para acesso local
    volumes:
      - redis_data:/data # persistência dos dados do cache
    networks:
      - mecaniqa-network

# Volumes persistentes para manter dados mesmo após reinício do ambiente
volumes:
  mysql_data:
  redis_data:

# Rede interna compartilhada pelos serviços da aplicação
networks:
  mecaniqa-network:
    driver: bridge
