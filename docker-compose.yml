version: '3.8' # Define a versão da especificação do Compose.

services: # Declara os serviços executados pela aplicação.
  api:
    build: . # Constrói a imagem usando o Dockerfile do diretório atual.
    restart: unless-stopped # Reinicia o serviço, exceto quando parado manualmente.
    ports:
      - "8080:8080" # Publica a porta da API no host.
    environment: # Define as configurações da aplicação.
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/mecaniqa # URL do MySQL.
      - SPRING_DATASOURCE_USERNAME=root # Usuário de acesso ao banco.
      - SPRING_DATASOURCE_PASSWORD=root # Senha de acesso ao banco.
      - SPRING_REDIS_HOST=redis # Nome do serviço Redis na rede interna.
      - SPRING_REDIS_PORT=6379 # Porta interna do Redis.
    depends_on: # Inicia a API após os serviços dependentes.
      - db # Serviço de banco de dados.
      - redis # Serviço de cache.
    networks:
      - mecaniqa-network # Conecta a API à rede interna.

  db:
    image: mysql:8.0 # Utiliza o MySQL na versão 8.0.
    restart: unless-stopped # Reinicia o serviço, exceto quando parado manualmente.
    ports:
      - "3306:3306" # Publica a porta do MySQL no host.
    environment: # Define a configuração inicial do banco.
      - MYSQL_DATABASE=mecaniqa # Cria o banco informado na inicialização.
      - MYSQL_ROOT_PASSWORD=root # Define a senha do usuário administrador.
    volumes:
      - mysql_data:/var/lib/mysql # Persiste os dados do MySQL.
    networks:
      - mecaniqa-network # Conecta o banco à rede interna.

  redis:
    image: redis:alpine # Utiliza uma imagem leve do Redis.
    restart: unless-stopped # Reinicia o serviço, exceto quando parado manualmente.
    ports:
      - "6379:6379" # Publica a porta do Redis no host.
    networks:
      - mecaniqa-network # Conecta o Redis à rede interna.

volumes: # Declara os volumes persistentes.
  mysql_data: # Armazena os dados do MySQL.

networks: # Declara as redes compartilhadas pelos serviços.
  mecaniqa-network: # Isola a comunicação interna da aplicação.
